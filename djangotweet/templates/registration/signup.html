{% extends "base.html" %}

{% block content %}

    <form method="POST">
        <div class = "container" style="border: 4px solid rosybrown; padding: 8px;">
            {% csrf_token %}
            
            {% for field in form %}
            
            <div class="mb-3">
                {{field.label_tag}}
                {{field}}
            </div>
            {% endfor %}
            
            
            <button type="submit" class="btn btn-primary">Signup</button>
       
        </div>
    </form>

{% endblock %}
